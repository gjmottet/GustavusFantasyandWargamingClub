<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visibility Test</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  .card {
    width: min(90vw, 560px);
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 20px 40px rgba(0,0,0,.4);
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: #94a3b8; font-size: .9rem; margin-bottom: 24px; }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid #334155;
    font-size: .92rem;
  }
  .row:last-of-type { border-bottom: none; }
  .label { color: #94a3b8; }
  .val { font-family: ui-monospace, Menlo, Consolas, monospace; text-align: right; word-break: break-all; }
  .ok   { color: #4ade80; }
  .bad  { color: #f87171; }
  .warn { color: #fbbf24; }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    color: #0f172a;
    background: #38bdf8;
    border: 0;
    border-radius: 9px;
    cursor: pointer;
  }
  button:hover { background: #7dd3fc; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <div class="card">
    <h1>✅ Page Loaded</h1>
    <div class="sub">If you can read this, the site is reachable and rendering.</div>

    <div class="row"><span class="label">Requested URL</span><span class="val" id="url">—</span></div>
    <div class="row"><span class="label">Hostname</span><span class="val" id="host">—</span></div>
    <div class="row"><span class="label">Page loaded at</span><span class="val" id="time">—</span></div>
    <div class="row"><span class="label">Protocol</span><span class="val" id="proto">—</span></div>
    <div class="row"><span class="label">Self-check (re-fetch)</span><span class="val" id="check">not run</span></div>

    <button id="btn">Run visibility check</button>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const here = location.href.split('?')[0];

  $('url').textContent   = location.href;
  $('host').textContent  = location.host || '(file://)';
  $('time').textContent  = new Date().toLocaleString();
  $('proto').textContent = location.protocol;

  async function check() {
    const out = $('check');
    out.className = 'val warn';
    out.textContent = 'checking…';

    // Cache-buster so we get a real network hit, not a cached copy
    const target = here + '?cachebust=' + Date.now();

    try {
      const res = await fetch(target, { method: 'GET', cache: 'no-store' });
      if (res.ok) {
        out.className = 'val ok';
        out.textContent = `OK — HTTP ${res.status}`;
      } else {
        out.className = 'val warn';
        out.textContent = `Responded — HTTP ${res.status}`;
      }
    } catch (err) {
      // Could be a CORS block rather than a real outage
      out.className = 'val bad';
      out.textContent = `Failed: ${err.message}`;
    }
  }

  $('btn').addEventListener('click', check);
  check(); // auto-run on load
</script>
</body>
</html>
